<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Automation opportunities</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --border: rgba(11, 11, 11, 0.10);
  --accent: #2a78d6;
  --accent-wash: rgba(42, 120, 214, 0.08);
  --mark: #fde8a6;
  --good: #006300;
  --warning: #8a5a00;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --border: rgba(255, 255, 255, 0.10);
    --accent: #3987e5;
    --accent-wash: rgba(57, 135, 229, 0.12);
    --mark: #5c4a12;
    --good: #0ca30c;
    --warning: #fab219;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --border: rgba(255, 255, 255, 0.10);
  --accent: #3987e5;
  --accent-wash: rgba(57, 135, 229, 0.12);
  --mark: #5c4a12;
  --good: #0ca30c;
  --warning: #fab219;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }
@media (max-width: 640px) { .wrap { padding: 0 16px; } }
.muted { color: var(--muted); }
.small { font-size: 13px; }

header { border-bottom: 1px solid var(--border); background: var(--surface); }
header .wrap { display: flex; align-items: center; gap: 16px; min-height: 52px; flex-wrap: wrap; }
.brand { font-weight: 600; }
.status { margin-left: auto; font-size: 13.5px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.running { background: var(--accent); animation: pulse 1.6s ease-in-out infinite; }
.dot.done { background: var(--good); }
.dot.stopped { background: var(--warning); }
@keyframes pulse { 50% { opacity: 0.3; } }
@media (prefers-reduced-motion: reduce) { .dot.running { animation: none; } }

.hero { padding: 36px 0 20px; }
.eyebrow { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
.figure b { display: block; font-size: 52px; line-height: 1; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.lead { font-size: 17px; margin: 8px 0 0; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 8px 20px; margin: 0 0 32px; }
.section-head { margin: 0 0 10px; }
.section-head h2 { font-size: 18px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
.section-head p { color: var(--ink-2); font-size: 14px; margin: 0; max-width: 760px; }
.item { padding: 14px 0; border-bottom: 1px solid var(--grid); }
.item:last-child { border-bottom: 0; }
.item .name { font-weight: 500; }
.item .change { margin-bottom: 4px; }
@media (max-width: 640px) { .card { padding: 4px 12px; } }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12.5px; padding: 12px 8px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
td { padding: 14px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th.r, td.r { text-align: right; }
.rank { color: var(--muted); width: 24px; }
.name { font-weight: 500; }
.change { color: var(--ink-2); font-size: 13.5px; margin-top: 2px; max-width: 560px; }
/* In the list the change is two lines at most; the opened row shows it whole. */
tr.row .change { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
tr.row.is-open .change { display: block; }
tr.row { cursor: pointer; }
tr.row:hover > td, tr.row.is-open > td { background: var(--accent-wash); }
/* The two dollar columns look alike; the one the list is sorted by is darker. */
.running, .open { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.open { font: inherit; background: none; border: 0; padding: 0; cursor: pointer; white-space: nowrap; }
.sort { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; white-space: nowrap; }
.sort:hover { color: var(--ink); }
.sort.on { color: var(--ink); font-weight: 600; }
td.sorted, td.sorted .open { color: var(--ink); font-weight: 600; }
@media (max-width: 700px) { .hide-narrow { display: none; } }
@media (max-width: 640px) {
  .figure b { font-size: 40px; }
  td, th { padding-left: 4px; padding-right: 4px; }
  th { white-space: normal; }
}
.name, .change, .quote .q { overflow-wrap: anywhere; }
.more { display: block; width: 100%; font: inherit; color: var(--ink-2); background: none; border: 0; padding: 14px 8px; cursor: pointer; text-align: left; }
.more:hover { color: var(--ink); }

tr.detail > td { background: var(--page); padding: 18px 20px 22px; }
.plan { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; margin: 0 0 6px; }
@media (max-width: 700px) { .plan { grid-template-columns: 1fr; } }
.plan h3 { font-size: 13px; font-weight: 600; margin: 0 0 4px; }
.plan p { margin: 0 0 12px; font-size: 14px; color: var(--ink-2); }
.formula { font-size: 16px; margin: 0 0 16px; }
.formula b { font-variant-numeric: tabular-nums; }
.so-far { color: var(--ink-2); font-size: 14px; margin: -8px 0 16px; }
.factor { padding: 14px 0; border-top: 1px solid var(--grid); max-width: 760px; }
.factor-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-bottom: 4px; }
.factor-head h3 { font-size: 13px; font-weight: 600; margin: 0; }
.factor-head b { font-size: 15px; font-variant-numeric: tabular-nums; }
.factor-head .src { color: var(--muted); font-size: 12.5px; }
.factor > p { margin: 0 0 8px; color: var(--ink-2); font-size: 14px; }
.quote { display: block; width: 100%; text-align: left; font: inherit; font-size: 14px; color: inherit; background: none; border: 0; border-left: 2px solid var(--accent); border-radius: 0; padding: 2px 0 2px 12px; margin: 10px 0 0; cursor: pointer; }
.quote:hover { background: var(--accent-wash); }
.quote .q { display: block; }
.quote .note { display: block; color: var(--ink-2); font-size: 13px; margin-top: 2px; }
.quote .meta { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
details.more-quotes { margin-top: 10px; }
details.more-quotes > summary { font-weight: 500; color: var(--ink-2); }
details.messages { padding-top: 14px; border-top: 1px solid var(--grid); font-size: 13.5px; max-width: 760px; }
summary { cursor: pointer; font-weight: 600; font-size: 13px; }
details.messages > .msgs { margin-top: 8px; }
details.once > summary { font-size: 15px; }
details.once > p { color: var(--ink-2); font-size: 14px; margin: 6px 0 10px; max-width: 760px; }
.msgs { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow-y: auto; }
.msgs button { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 2px 10px; width: 100%; text-align: left; font: inherit; font-size: 13px; color: inherit; background: none; border: 0; border-bottom: 1px solid var(--grid); padding: 7px 4px; cursor: pointer; }
.msgs button:hover { background: var(--accent-wash); }
.msgs .d { color: var(--muted); grid-row: span 2; }
.msgs .s, .msgs .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msgs .t { color: var(--ink-2); font-style: italic; }

/* The drafted artifact: beside the figure in the opened opportunity. */
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 400px); gap: 0 28px; align-items: start; margin-top: 10px; padding-top: 16px; border-top: 1px solid var(--grid); }
.split.solo { grid-template-columns: minmax(0, 1fr); }
.no-draft { border: 1px dashed var(--border); border-radius: 10px; padding: 14px 18px; color: var(--ink-2); font-size: 13.5px; }
.no-draft .kicker { color: var(--muted); font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 4px; }
.draft { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 6px 20px rgba(0, 0, 0, 0.06); }
@media (max-width: 860px) {
  .split { grid-template-columns: minmax(0, 1fr); }
  .draft { order: -1; margin: 0 0 18px; }
}
.draft-head { padding: 14px 18px 12px; border-bottom: 1px solid var(--grid); }
.draft-head .kicker { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.draft-head .kicker b { color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; font-size: 11.5px; margin-right: 6px; }
.draft-head .title { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
.draft-head .for { font-size: 13px; color: var(--ink-2); margin-top: 4px; }
.draft-preview { position: relative; max-height: 360px; overflow: hidden; padding: 14px 18px 0; }
.draft-preview::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 72px; background: linear-gradient(transparent, var(--surface)); }
.draft-foot { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 18px 14px; }
.btn { font: inherit; font-size: 13.5px; color: var(--ink); background: none; border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.btn:hover { border-color: var(--accent); background: var(--accent-wash); }
.btn.primary { color: #fff; background: var(--accent); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }

/* Markdown a model wrote, rendered from its text: no HTML in it is ever used. */
.md { font-size: 14.5px; line-height: 1.6; overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; }
.md p, .md ul, .md ol, .md blockquote, .md pre, .md table { margin: 0 0 12px; }
.md ul, .md ol { padding-left: 22px; }
.md li { margin: 2px 0; }
.md li > ul, .md li > ol, .md li > p { margin: 2px 0; }
.md h3 { font-size: 16px; margin: 18px 0 8px; }
.md h4 { font-size: 14.5px; margin: 16px 0 6px; }
.md hr { border: 0; border-top: 1px solid var(--grid); margin: 18px 0; }
.md blockquote { border-left: 3px solid var(--grid); padding-left: 12px; color: var(--ink-2); }
.md code, .md pre { font: 13px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace; background: var(--page); border-radius: 4px; }
.md code { padding: 1px 4px; }
.md pre { padding: 10px 12px; white-space: pre-wrap; }
.md table { border-collapse: collapse; font-size: 13.5px; }
.md th, .md td { border: 1px solid var(--grid); padding: 6px 8px; text-align: left; vertical-align: top; white-space: normal; color: var(--ink); font-size: inherit; }
.md th { font-weight: 600; }
.drawer .md { font-size: 15px; }
.drawer-actions { display: flex; gap: 8px; margin: 0 0 18px; }

.steps { list-style: none; margin: 0; padding: 8px 0; }
.steps li { display: flex; gap: 12px; padding: 7px 0; color: var(--muted); }
.steps li.done { color: var(--ink-2); }
.steps li.now { color: var(--ink); font-weight: 500; }
.steps .m { width: 18px; text-align: center; }
.steps li.done .m { color: var(--good); }
.steps li.now .m { color: var(--accent); }
.meter { height: 6px; background: var(--grid); border-radius: 3px; overflow: hidden; width: 160px; margin-top: 8px; }
.meter div { height: 100%; background: var(--accent); }
.empty { padding: 40px 0; }
.empty h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -0.02em; }
.empty p { color: var(--ink-2); margin: 0 0 16px; }

.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.28); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100%); background: var(--surface); z-index: 21; display: flex; flex-direction: column; box-shadow: -8px 0 32px rgba(0, 0, 0, 0.12); }
.drawer-head { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; gap: 16px; align-items: flex-start; }
.drawer-head .sub { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
.close { margin-left: auto; background: none; border: 1px solid var(--border); border-radius: 8px; color: var(--ink); padding: 6px 12px; cursor: pointer; font: inherit; }
.drawer-body { overflow-y: auto; padding: 16px 24px 32px; }
.verified { font-size: 13px; margin: 0 0 12px; }
.status-good { color: var(--good); }
.status-warn { color: var(--warning); }
pre.msg { white-space: pre-wrap; word-wrap: break-word; font: 13px/1.55 ui-monospace, "Cascadia Mono", Consolas, monospace; margin: 0; }
mark { background: var(--mark); color: inherit; border-radius: 2px; }
</style>
</head>
<body>
<header><div class="wrap"><div class="brand">Automation opportunities</div><div class="status" id="status"></div></div></header>
<main id="app" class="wrap"><p class="empty muted">Loading…</p></main>
<div id="overlay"></div>
<script>
"use strict";

// Every value from the run, emails included, is inserted as text, never as HTML.
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : String(kid));
  }
  return el;
}

const money = x => "$" + Math.round(x).toLocaleString("en-US");
const num = x => (+(+x).toFixed(2)).toLocaleString("en-US", {maximumFractionDigits: 2});
const hrs = x => x.toLocaleString("en-US", {minimumFractionDigits: 1, maximumFractionDigits: 1});
const plural = (n, one, many) => `${num(n)} ${n === 1 ? one : (many || one + "s")}`;
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const monthLabel = ym => `${MONTHS[+ym.slice(5, 7) - 1]} ${ym.slice(0, 4)}`;
const dateLabel = iso => iso ? `${+iso.slice(8, 10)} ${MONTHS[+iso.slice(5, 7) - 1]} ${iso.slice(0, 4)}` : "no date";
function since(iso) {
  const s = Math.max(0, Math.round((Date.now() - new Date(iso)) / 1000));
  return s < 60 ? `${s} s` : s < 3600 ? `${Math.floor(s / 60)} min` : `${Math.floor(s / 3600)} h ${Math.floor(s % 3600 / 60)} min`;
}

let R = null;               // the report: what the run has produced
let P = null;               // the run's progress
const open = new Set();     // opportunities whose evidence is shown
let showAll = false;
// The list is sorted by one of its dollar columns, largest first.
let sortBy = "month";
const SORTS = {month: o => o.dollars_per_month, so_far: o => o.so_far ? o.so_far.dollars : 0};
// A link to the page with #opp-NN opens that opportunity's evidence.
if (/^#opp-\d+$/.test(location.hash)) open.add(location.hash.slice(1));

// ---- the run's progress ----
const STEPS = {
  prepare: "Reading and batching the mail", readers: "Reading every message for recurring work",
  explore: "Exploring the mail and checking each proposal", drafters: "Drafting the top opportunities",
  finalize: "Writing the report",
};

function runState() {
  const current = P.steps.find(s => !s.done), st = P.run ? P.run.status : "";
  if (P.active) return {kind: "running", current, text: "Running"};
  if (!current || st.startsWith("DONE")) return {kind: "done", current, text: "Run finished"};
  if (!P.run && !P.steps.some(s => s.done)) return {kind: "none", current, text: "No run yet"};
  if (st.startsWith("FAILED")) return {kind: "stopped", current, text: "Stopped: " + st.slice(7)};
  return {kind: "stopped", current, text: "Stopped: running it again continues"};
}

function stepText(step) {
  const [n, total] = step.count || [0, 0];
  return STEPS[step.step] + (total ? ` (${n} of ${total})` : "");
}

function renderStatus() {
  const s = runState();
  const what = s.kind === "running" && s.current
    ? stepText(s.current) + (P.run ? ` · ${since(P.run.started)}` : "") : s.text;
  // A finished run needs no status: the results are the page.
  document.getElementById("status").replaceChildren(...(s.kind === "done" ? []
    : [h("span", {class: "dot " + s.kind}), h("span", null, what)]));
}

function viewProgress() {
  const s = runState();
  return h("section", {class: "empty"},
    h("h1", null, s.kind === "none" ? "No run yet" : s.kind === "running" ? "The run is in progress" : "The run has not ranked anything yet"),
    h("p", null, s.kind === "none" ? "Start one with /run-pipeline. This page follows it as it goes."
      : s.kind === "running" ? "The ranked opportunities appear here as soon as they are ready." : s.text + "."),
    P.run && P.run.step === "explore" ? null : h("ol", {class: "steps"}, P.steps.map(step => {
      const now = step === s.current && s.kind !== "none";
      const [n, total] = step.count || [0, 0];
      return h("li", {class: step.done ? "done" : now ? "now" : ""},
        h("span", {class: "m"}, step.done ? "✓" : now ? "●" : "○"),
        h("div", null, stepText(step),
          now && total ? h("div", {class: "meter"}, h("div", {style: `width:${n / total * 100}%`})) : null));
    })));
}

// ---- the opportunities ----
function viewResults() {
  const t = R.totals;
  const ranked = R.opportunities.filter(o => o.rank != null);
  const value = SORTS[sortBy];
  const sorted = [...ranked].sort((a, b) => value(b) - value(a) || a.rank - b.rank);
  // The rest are shown when asked for, or when one of them is open (from a link to it).
  if (sorted.slice(t.drafted || 10).some(o => open.has(o.id))) showAll = true;
  const shown = showAll ? sorted : sorted.slice(0, t.drafted || 10);
  const rest = sorted.slice(shown.length);
  const months = Object.values(R.mailboxes).flatMap(b => b.months).sort();

  const rows = [];
  for (const [i, o] of shown.entries()) {
    const id = "d-" + o.id, isOpen = open.has(o.id);
    // The whole row opens the opportunity; the button is there for the keyboard, and its click reaches the row.
    rows.push(h("tr", {class: "row" + (isOpen ? " is-open" : ""), onclick: () => { isOpen ? open.delete(o.id) : open.add(o.id); render(); }},
      h("td", {class: "rank"}, i + 1),
      h("td", null, h("div", {class: "name"}, o.name),
        h("div", {class: "change"}, o.change)),
      h("td", {class: "r" + (sortBy === "month" ? " sorted" : "")}, h("button", {class: "open", "aria-expanded": String(isOpen), "aria-controls": id,
        title: "How this figure is made, and the messages it comes from"}, money(o.dollars_per_month))),
      h("td", {class: "r running" + (sortBy === "so_far" ? " sorted" : "")}, o.so_far ? money(o.so_far.dollars) : "–")));
    if (isOpen) rows.push(h("tr", {class: "detail", id}, h("td", {colspan: 4}, evidence(o))));
  }

  return [
    h("section", {class: "hero"},
      h("p", {class: "eyebrow"}, `Enron email archive · ${plural(Object.keys(R.mailboxes).length, "mailbox", "mailboxes")}` +
        (months.length ? ` · ${monthLabel(months[0])} – ${monthLabel(months[months.length - 1])}` : "")),
      h("div", {class: "figure"}, h("b", null, money(t.dollars_per_month) + " a month")),
      h("p", {class: "lead"}, `of staff time could be saved: ${hrs(t.hours_per_month)} hours a month, ` +
        `across ${plural(ranked.length, "opportunity", "opportunities")}.` +
        (t.dollars_so_far ? ` Since each first shows in the mail, they have cost ${money(t.dollars_so_far)}.` : ""))),
    h("section", {class: "card", id: "ranked"}, h("table", null,
      h("thead", null, h("tr", null, h("th", null, "#"), h("th", null, "Opportunity"),
        sortHead("month", "Saved a month", "Saved each month, once the change is made"),
        sortHead("so_far", "Cost so far", "Saved a month × the months since it first shows in the mail"))),
      h("tbody", null, rows)),
      rest.length ? h("button", {class: "more", onclick: () => { showAll = true; render(); }}, "See more") : null),
    onceView(),
  ];
}

function sortHead(key, label, title) {
  const on = sortBy === key;
  return h("th", {class: "r", "aria-sort": on ? "descending" : "none"},
    h("button", {class: "sort" + (on ? " on" : ""), title, onclick: () => { sortBy = key; render(); }}, label));
}

// Work the archive shows once: what it says may matter, but it cannot be ranked.
function onceView() {
  const once = R.opportunities.filter(o => o.rank == null && (o.unused || "").startsWith("it happened once"));
  if (!once.length) return null;
  return h("section", null, h("details", {class: "once"},
    h("summary", null, `Seen once, not ranked (${once.length})`),
    h("p", null, "Each appears once in the mail with no sign that it recurs, so it is not in the figures above; " +
      "it may still be worth asking the people involved."),
    h("div", {class: "card"}, once.map(o => { const p = R.processes.find(x => x.id === o.process);
      return h("div", {class: "item"}, h("div", {class: "name"}, o.name),
        o.change ? h("div", {class: "change"}, o.change) : null,
        p ? p.evidence.occurrences.slice(0, 1).map(quote) : null); }))));
}

function evidence(o) {
  const r = o.rate, c = r.counted, p = R.processes.find(x => x.id === o.process);
  const boxes = c.mailboxes.join(", ");
  const times = plural(c.times, "time") + (c.messages > c.times ? ` (in ${c.messages} messages)` : "");
  const often = r.source === "stated"
    ? [h("p", null, "Stated in the mail" + (r.stated.per && r.stated.per !== "month"
         ? `: ${num(r.stated.count)} a ${r.stated.per}, which is ${num(r.stated.per_month)} a month.` : ".")),
       quote(r.stated.quote)]
    : [h("p", null, c.span
         // Work that goes on is counted by the intervals between its times.
         ? `Counted in ${boxes}'s mail: ${times} from ${monthLabel(c.span[0])} to ${monthLabel(c.span[1])}, ` +
           `so ${plural(c.times - 1, "interval")} in ${plural(c.months, "month")}: ${num(c.times - 1)} ÷ ${num(c.months)} = ${num(c.per_month)} a month.`
         : `Counted in ${boxes}'s mail: ${times} in the ${plural(c.months, "month")} it holds` +
           `${o.ongoing === false ? " (an episode that will not continue)" : ""}: ${num(c.times)} ÷ ${num(c.months)} = ${num(c.per_month)} a month.`)];
  const key = c => c.message + "\u0000" + c.quote;
  // Each quote is shown once: the rate's under how often, the rest under the time lost.
  const rateWords = r.source === "stated" ? key(r.stated.quote) : null;
  const basis = o.basis.filter(b => key(b) !== rateWords);
  // What the work is and what changes, then the figure beside the draft that would start the change.
  const draft = R.drafts[o.id];
  // Where the draft would be, an opportunity that was not chosen for one says why.
  const side = !draft && !o.draft && R.totals.drafted ? h("aside", {class: "no-draft"},
    h("div", {class: "kicker"}, draftKind() ? capital(draftKind()) + " not drafted" : "Not drafted"),
    `Drafts are written for the ${R.totals.drafted} opportunities that save the most each month.`) : null;
  return [
    h("div", {class: "plan"},
      p ? h("div", null, h("h3", null, "Today"), h("p", null, p.summary)) : null,
      h("div", null, h("h3", null, "The change"), h("p", null, o.explanation || o.change))),
    h("div", {class: "split" + (draft || side ? "" : " solo")}, h("div", null, figured(o, r, often, basis, p)),
      draft ? draftCard(o, draft) : side),
  ];
}

function figured(o, r, often, basis, p) {
  return [
    h("p", {class: "formula"}, h("b", null, `${num(o.minutes)} min`), " saved each time × ", h("b", null, num(r.per_month)),
      " times a month = ", h("b", null, `${num(o.hours_per_month)} hours`), ` × $${R.totals.hourly_rate} = `, h("b", null, money(o.dollars_per_month)), " a month"),
    o.so_far ? h("p", {class: "so-far"}, `It has cost ${money(o.so_far.dollars)} so far: ${money(o.dollars_per_month)} a month for ` +
      `${plural(o.so_far.months, "month")}, from ${monthLabel(o.so_far.from)}, when it first shows in the mail, ` +
      `to ${monthLabel(o.so_far.to)}, where the mail ends.`) : null,
    h("section", {class: "factor"},
      h("div", {class: "factor-head"}, h("h3", null, "How often"), h("b", null, `${num(r.per_month)} times a month`)),
      often),
    h("section", {class: "factor"},
      h("div", {class: "factor-head"}, h("h3", null, "Time lost each time"), h("b", null, `${num(o.minutes)} minutes`)),
      o.reasoning ? h("p", null, o.reasoning) : null,
      quotes(basis)),
    p ? occurrences(p) : null,
  ];
}

// ---- the drafted artifact ----
const capital = s => s.charAt(0).toUpperCase() + s.slice(1);
// What the drafts are, when they are all one kind (an email): a missing one is named as that.
function draftKind() {
  const kinds = new Set(Object.values(R.drafts).map(d => d.kind.toLowerCase()));
  return kinds.size === 1 ? [...kinds][0] : null;
}

function draftCard(o, d) {
  return h("section", {class: "draft"},
    h("div", {class: "draft-head"},
      h("div", {class: "kicker"}, h("b", null, "Drafted " + d.kind.toLowerCase())),
      h("div", {class: "title"}, d.title),
      h("div", {class: "for"}, "For: ", d.audience)),
    h("div", {class: "draft-preview md"}, md(d.body)),
    h("div", {class: "draft-foot"},
      h("button", {class: "btn primary", onclick: () => openDraft(o, d)}, "Read the full " + d.kind.toLowerCase()),
      copyButton(d)));
}

function copyButton(d) {
  const button = h("button", {class: "btn", onclick: async () => {
    try {
      await navigator.clipboard.writeText(`${d.title}\n\n${d.body.trim()}\n`);
      button.textContent = "Copied";
    } catch (err) {
      button.textContent = "Could not copy";
    }
    setTimeout(() => { button.textContent = "Copy the text"; }, 2000);
  }}, "Copy the text");
  return button;
}

function openDraft(o, d) {
  const body = drawer(d.title, `${capital(d.kind)} for opportunity ${o.rank}, ${o.name} · For: ${d.audience}`);
  body.replaceChildren(h("div", {class: "drawer-actions"}, copyButton(d)), h("div", {class: "md"}, md(d.body)));
}

// Markdown to elements: headings, rules, lists, quotes, tables, code, and bold,
// italic, code and links in a line. Every piece of text is inserted as text.
const LIST_ITEM = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
const FENCE = /^\s*```/;
const RULE = /^\s*([-*_])(\s*\1){2,}\s*$/;
const HEADING = /^\s*(#{1,6})\s+(.*?)\s*#*\s*$/;
const TABLE_RULE = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)*\|?\s*$/;
const startsBlock = (line, next) => HEADING.test(line) || RULE.test(line) || LIST_ITEM.test(line) || FENCE.test(line) ||
  /^\s*>/.test(line) || (/^\s*\|/.test(line) && next != null && TABLE_RULE.test(next));
const indentOf = line => line.match(/^\s*/)[0].replace(/\t/g, "    ").length;

function md(src) {
  const lines = src.replace(/\r\n?/g, "\n").split("\n");
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    let m;
    if (!line.trim()) { i++; continue; }
    if (FENCE.test(line)) {
      const code = [];
      for (i++; i < lines.length && !FENCE.test(lines[i]); i++) code.push(lines[i]);
      out.push(h("pre", null, code.join("\n")));
      i++;
    } else if ((m = line.match(HEADING))) {
      out.push(h(m[1].length <= 2 ? "h3" : "h4", null, inline(m[2])));
      i++;
    } else if (RULE.test(line)) {
      out.push(h("hr"));
      i++;
    } else if (/^\s*>/.test(line)) {
      const quoted = [];
      for (; i < lines.length && /^\s*>/.test(lines[i]); i++) quoted.push(lines[i].replace(/^\s*>\s?/, ""));
      out.push(h("blockquote", null, md(quoted.join("\n"))));
    } else if (/^\s*\|/.test(line) && TABLE_RULE.test(lines[i + 1] || "")) {
      const cells = row => row.trim().replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim()));
      const head = cells(line), rows = [];
      for (i += 2; i < lines.length && /^\s*\|/.test(lines[i]); i++) rows.push(cells(lines[i]));
      out.push(h("table", null, h("thead", null, h("tr", null, head.map(c => h("th", null, c)))),
        h("tbody", null, rows.map(r => h("tr", null, r.map(c => h("td", null, c)))))));
    } else if ((m = line.match(LIST_ITEM))) {
      const base = indentOf(line), ordered = /\d/.test(m[2]);
      const items = [];
      while (i < lines.length) {
        const l = lines[i], item = l.match(LIST_ITEM);
        if (item && indentOf(l) <= base && /\d/.test(item[2]) === ordered) {
          items.push({text: [item[3]], inner: []});
        } else if (l.trim() && (indentOf(l) > base || !startsBlock(l, lines[i + 1])) && items.length) {
          // Deeper lines belong to the item: a nested list, or more of its text.
          const last = items[items.length - 1];
          if (indentOf(l) > base && (last.inner.length || LIST_ITEM.test(l))) last.inner.push(l);
          else last.text.push(l.trim());
        } else if (!l.trim() && i + 1 < lines.length && (indentOf(lines[i + 1]) > base && lines[i + 1].trim()
                   || (LIST_ITEM.test(lines[i + 1]) && indentOf(lines[i + 1]) === base))) {
          // A blank line between items, or before more of an item, keeps the list going.
        } else {
          break;
        }
        i++;
      }
      const dedent = rows => { const n = Math.min(...rows.filter(r => r.trim()).map(indentOf));
        return rows.map(r => r.replace(/\t/g, "    ").slice(n)).join("\n"); };
      out.push(h(ordered ? "ol" : "ul", ordered && +m[2] !== 1 ? {start: parseInt(m[2], 10)} : null,
        items.map(it => h("li", null, lineBreaks(it.text), it.inner.length ? md(dedent(it.inner)) : null))));
    } else {
      const para = [];
      for (; i < lines.length && lines[i].trim() && (!para.length || !startsBlock(lines[i], lines[i + 1])); i++) {
        para.push(lines[i].trim());
      }
      out.push(h("p", null, lineBreaks(para)));
    }
  }
  return out;
}

// A line break in a draft is kept, as an email's lines are.
const lineBreaks = rows => rows.flatMap((r, k) => k ? [h("br"), inline(r)] : [inline(r)]);

const INLINE = /\*\*(.+?)\*\*|__(.+?)__|(?<![\w*])\*(?![\s*])(.+?)(?<![\s*])\*(?![\w*])|(?<!\w)_(?![\s_])(.+?)(?<![\s_])_(?!\w)|`([^`]+)`|\[([^\]]+)\]\(([^)\s]+)\)/g;

function inline(text) {
  const out = [];
  let at = 0;
  for (const m of text.matchAll(INLINE)) {
    out.push(text.slice(at, m.index));
    if (m[1] != null || m[2] != null) out.push(h("strong", null, inline(m[1] ?? m[2])));
    else if (m[3] != null || m[4] != null) out.push(h("em", null, inline(m[3] ?? m[4])));
    else if (m[5] != null) out.push(h("code", null, m[5]));
    // Only a web address becomes a link; anything else stays the words it was written as.
    else out.push(/^https?:\/\//i.test(m[7]) ? h("a", {href: m[7], target: "_blank", rel: "noopener noreferrer"}, inline(m[6])) : m[0]);
    at = m.index + m[0].length;
  }
  out.push(text.slice(at));
  return out.filter(x => x !== "");
}

// The messages that show the work, by date.
function occurrences(p) {
  const all = p.evidence.occurrences;
  const byDate = (a, b) => ((R.messages[a.message] || {}).date || "9").localeCompare((R.messages[b.message] || {}).date || "9");
  return h("details", {class: "messages"},
    h("summary", null, all.length === 1 ? "The message that shows this work" : `The ${all.length} messages that show this work`),
    h("ul", {class: "msgs"}, [...all].sort(byDate).map(cite => { const m = R.messages[cite.message] || {};
      return h("li", null, h("button", {onclick: () => openMessage(cite.message, [cite.quote])},
        h("span", {class: "d"}, dateLabel(m.date)),
        h("span", {class: "s"}, `${m.subject || "(no subject)"} · ${m.from || ""}`),
        h("span", {class: "t"}, `“${cite.quote}”`))); })));
}

// The first quotes are shown; the rest open on request.
function quotes(cites) {
  const SHOWN = 2;
  if (cites.length <= SHOWN + 1) return cites.map(c => quote(c));
  return [cites.slice(0, SHOWN).map(c => quote(c)),
    h("details", {class: "more-quotes"}, h("summary", null, `${cites.length - SHOWN} more quotes`), cites.slice(SHOWN).map(c => quote(c)))];
}

function quote(cite) {
  const m = R.messages[cite.message] || {};
  return h("button", {class: "quote", onclick: () => openMessage(cite.message, [cite.quote])},
    h("span", {class: "q"}, "“", cite.quote, "”"),
    cite.note ? h("span", {class: "note"}, cite.note) : null,
    h("span", {class: "meta"}, `${m.from || ""} · ${dateLabel(m.date)} · ${m.subject || "(no subject)"}`));
}

// ---- a message, opened from a quote ----
function drawer(title, sub) {
  const overlay = document.getElementById("overlay");
  const body = h("div", {class: "drawer-body"}, h("p", {class: "muted"}, "Loading…"));
  const close = () => overlay.replaceChildren();
  overlay.replaceChildren(h("div", {class: "scrim", onclick: close}),
    h("div", {class: "drawer", role: "dialog", "aria-label": title},
      h("div", {class: "drawer-head"}, h("div", null, h("div", {class: "name"}, title), h("div", {class: "sub"}, sub)),
        h("button", {class: "close", onclick: close}, "Close")), body));
  return body;
}
document.addEventListener("keydown", e => { if (e.key === "Escape") document.getElementById("overlay").replaceChildren(); });

async function openMessage(id, quotes) {
  const m0 = R.messages[id] || {};
  const body = drawer(m0.subject || "(no subject)", id);
  const q = new URLSearchParams({id}); quotes.forEach(x => q.append("q", x));
  const res = await fetch("/api/message?" + q);
  if (!res.ok) return body.replaceChildren(h("p", null, "This message is not in the run."));
  const m = await res.json();
  const found = m.spans.filter(Boolean).length;
  body.replaceChildren(
    h("p", {class: "verified " + (found ? "status-good" : "status-warn")},
      found ? "✓ The quoted words are in this message, marked below." : "The quoted words are not in this message."),
    h("p", {class: "small muted"}, `${m.date ? m.date.replace("T", " ") + " UTC" : "No usable date"} · file ${m.file}`),
    m.spans.some((s, i) => s && !m.raw_spans[i]) ? h("p", {class: "small muted"},
      "The file stores this message quoted-printable encoded, which breaks lines with “=” and writes some characters as codes; " +
      "it is shown here decoded, so a search of the raw file may not find the quoted words as written.") : null,
    h("pre", {class: "msg"}, highlighted(m.text, m.spans)));
  const first = body.querySelector("mark");
  if (first) first.scrollIntoView({block: "center"});
}

function highlighted(text, spans) {
  const out = [];
  let at = 0;
  for (const [a, b] of spans.filter(Boolean).sort((x, y) => x[0] - y[0])) {
    if (b <= at) continue;
    out.push(text.slice(at, Math.max(a, at)), h("mark", null, text.slice(Math.max(a, at), b)));
    at = b;
  }
  out.push(text.slice(at));
  return out;
}

// ---- keeping up with the run ----
function render() {
  const y = window.scrollY;
  document.getElementById("app").replaceChildren(...[].concat(R.scored ? viewResults() : viewProgress()).filter(x => x != null));
  window.scrollTo(0, y);
  renderStatus();
}

async function loadReport() {
  R = await (await fetch("/api/report")).json();
}

// Ask what the run is doing every few seconds; fetch the results again only when the run has written new ones.
let version = null;
async function poll() {
  try {
    P = await (await fetch("/api/progress")).json();
    if (P.version !== version) {
      version = P.version;
      await loadReport();
      render();
    } else if (!R.scored) {
      render();
    } else {
      renderStatus();
    }
  } catch (err) {
    // The server is busy or restarting: keep the page and ask again.
  }
  setTimeout(poll, P && P.active ? 2000 : 5000);
}

poll();
</script>
</body>
</html>
